name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open a PNG with transparency\n2. Adjust Size to 50%\n3. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glance version (About Glance)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Flatpak, Built from source]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distro and GNOME version
      placeholder: Ubuntu 26.04, GNOME 50
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File type involved
      placeholder: "JPEG from a phone, 16-bit PNG, multi-page PDF, …"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Terminal output (run `glance` or `flatpak run io.github.kaibae19.Glance` from a terminal), screenshots, or a sample file with private metadata removed.
